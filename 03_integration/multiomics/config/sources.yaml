# Dataset registry.
#
# Every entry is an adapter description: where the table lives and how its
# columns map onto the pipeline's standard schema
#   layer, dataset, norm, feature_id, gene, site, logFC, pval, padj, direction
#
# layer  : proteome | phospho | transcriptome | genome | scrna
# norm   : for phospho only -- "raw" (phospho abundance as measured) or
#          "prot_adj" (phosphosite ratio divided out by the parent protein).
#          Other layers use "na".
# fc_scale: log2 | linear  (linear is log2-transformed on load)
# universe: where the background gene list for ORA comes from.
#           self        -> the genes present in this table
#           ref:<name>  -> the genes of another dataset entry (use when the
#                          table has been pre-filtered to significant hits)
# calls   : how is_sig/direction is derived
#           stats       -> from padj/pval + logFC via the threshold schemes
#           provided    -> the table only ships a direction call; that call is
#                          reused for every threshold scheme (flagged in output)
#           prefiltered -> the table is already a significance-filtered subset;
#                          every row counts as significant under every scheme

# Paths are relative to this sub-project's root
# (03_integration/multiomics). The source tables are not redistributable and are
# not tracked; put them under the repository's own `data/raw/`, as `data/README.md`
# describes, or point these keys wherever they live locally.
paths:
  proteomics_xlsx: "../../data/raw/GEC_tissue_proteomics_DEP_Master table.xlsx"
  phospho_xlsx: "../../data/raw/GEC_tissue_phosphoproteome_DEP_Master_table.xlsx"
  # Full per-dataset outputs from Multiomics_meta_analysis/02_phosphoproteomics.
  # One sheet carries BOTH arms (Phospho_* = raw, Adjusted_* = protein-adjusted)
  # for the same sites, which is what makes the paired comparison possible.
  pe2_phospho_full: "../../data/raw/PE2_phospho_adjusted_results.xlsx"
  pe5_phospho_full: "../../data/raw/PE5_site_table_T2T3_vs_T0_none.csv"
  # Genomics: per-cohort master workbooks of truncating LOF variants.
  gen_egas: "../../data/raw/genomics/EGAS00001002864_Master_Table_20260905.xlsx"
  gen_hra: "../../data/raw/genomics/HRA000021_Master_Table_20260905.xlsx"
  gen_srp: "../../data/raw/genomics/SRP185502_Master_Table_20260907.xlsx"
  gen_tcga_esca: "../../data/raw/genomics/TCGA_ESCA_white_Master_Table_20260914.xlsx"
  gen_tcga_stad: "../../data/raw/genomics/TCGA_STAD_white_Master_Table_20260910.xlsx"

datasets:

  # ---------------------------------------------------------------- proteome
  - name: PG1
    tissue: gastric
    layer: proteome
    norm: na
    file: proteomics_xlsx
    sheet: PG1
    gene: Gene
    feature_id: ID
    logFC: Fold_Change
    pval: P_Value
    padj: P_adj
    fc_scale: log2
    universe: self
    calls: stats

  - name: PG2
    tissue: gastric
    layer: proteome
    norm: na
    file: proteomics_xlsx
    sheet: PG2
    gene: null              # UniProt accessions only -> mapped in harmonize
    uniprot: "Protein ID"
    feature_id: "Protein ID"
    logFC: log2FC_tumor_vs_normal
    pval: P_Value
    padj: P_adj
    fc_scale: log2
    universe: self
    calls: stats

  - name: PG3
    tissue: gastric
    layer: proteome
    norm: na
    file: proteomics_xlsx
    sheet: PG3
    gene: Gene
    feature_id: ID
    logFC: Fold_Change
    pval: P_Value
    padj: P_adj
    fc_scale: log2
    universe: self
    calls: stats

  - name: PG4
    tissue: gastric
    layer: proteome
    norm: na
    file: proteomics_xlsx
    sheet: PG4
    gene: Gene
    feature_id: Gene
    logFC: log2FC_tumor_vs_normal
    pval: P_Value
    padj: P_adj
    fc_scale: log2
    universe: self
    calls: stats

  - name: PE1
    tissue: esophageal
    layer: proteome
    norm: na
    file: proteomics_xlsx
    sheet: PE1
    gene: "Gene symbol"
    uniprot: "UniProt ID"
    feature_id: "UniProt ID"
    logFC: log2FC_tumor_vs_normal
    pval: P_Value
    padj: P_adj
    fc_scale: log2
    universe: self
    calls: stats

  - name: PE2
    tissue: esophageal
    layer: proteome
    norm: na
    file: proteomics_xlsx
    sheet: PE2
    gene: "Gene name"
    uniprot: "Protein accession"
    feature_id: "Protein accession"
    logFC: Ratio             # linear tumor/normal ratio
    pval: "P value"
    padj: null               # no FDR shipped -> BH computed on load
    fc_scale: linear
    universe: self
    calls: stats

  # PE3 ships direction calls only (merged tumor-vs-gastritis / tumor-vs-
  # oesophagus contrasts, consistent calls kept). No effect size, so the three
  # threshold schemes collapse to the same call for this dataset.
  - name: PE3
    tissue: esophageal
    layer: proteome
    norm: na
    file: proteomics_xlsx
    sheet: PE3_merged
    gene: Name
    feature_id: ENSG
    logFC: null
    pval: null
    padj: null
    direction: consistent_direction
    fc_scale: log2
    universe: self
    calls: provided

  - name: PE5
    tissue: esophageal
    layer: proteome
    norm: na
    file: proteomics_xlsx
    sheet: PE5
    gene: Gene
    feature_id: ID
    logFC: Fold_Change
    pval: P_Value
    padj: P_adj
    fc_scale: log2
    universe: self
    calls: stats

  # ----------------------------------------------------------------- phospho
  # PG4 is the only cohort shipping the *full* site table for both
  # normalisations (14,659 sites in common), so it carries the paired
  # raw-vs-prot_adj comparison. PE2/PE5 ship filtered subsets for at least one
  # arm; their background is borrowed and the comparison is set-level only.

  - name: PG4
    tissue: gastric
    layer: phospho
    tissue: gastric
    norm: raw
    file: phospho_xlsx
    sheet: PG4
    header: 0
    gene: Gene
    feature_id: Phosphosite
    site: Residues
    logFC: logFC
    pval: P
    padj: adj.P
    fc_scale: log2
    universe: self
    calls: stats
    paired_with: PG4|prot_adj

  - name: PG4
    tissue: gastric
    layer: phospho
    tissue: gastric
    norm: prot_adj
    file: phospho_xlsx
    sheet: PG4_adj
    header: 0
    gene: Gene
    feature_id: Phosphosite
    site: Residues
    logFC: logFC
    pval: P
    padj: adj.P
    fc_scale: log2
    universe: self
    calls: stats
    paired_with: PG4|raw

  # PE2: Adjusted_site_table is the full paired table -- 11,002 sites with
  # protein quantified, both arms on the same row. Supersedes the master
  # workbook's PE2 / PE2_adj sheets, which were the DEP lists.
  - name: PE2
    tissue: esophageal
    layer: phospho
    tissue: esophageal
    norm: raw
    file: pe2_phospho_full
    sheet: Adjusted_site_table
    header: 0
    gene: "Gene name"
    uniprot: "Protein accession"
    feature_id: Site
    site: Position
    logFC: Phospho_logFC
    pval: Phospho_P
    padj: "Phospho_adj.P"
    fc_scale: log2
    universe: self
    calls: stats
    paired_with: PE2|prot_adj

  - name: PE2
    tissue: esophageal
    layer: phospho
    tissue: esophageal
    norm: prot_adj
    file: pe2_phospho_full
    sheet: Adjusted_site_table
    header: 0
    gene: "Gene name"
    uniprot: "Protein accession"
    feature_id: Site
    site: Position
    logFC: Adjusted_logFC
    pval: Adjusted_P
    padj: "Adjusted_adj.P"
    fc_scale: log2
    universe: self
    calls: stats
    paired_with: PE2|raw

  # PE5: the full site table written by the per-dataset notebook
  # (PE5_phospho_analysis.ipynb -> site_table()). Every phosphopeptide of the
  # merged feature set is a row; `Tested_in` / the per-arm P column say which
  # arms produced a statistic, so `require_notna` trims each arm to what it
  # actually measured (raw 4,211 features, protein-adjusted 2,340 of 48,863
  # rows -- PE5 is sparse and most peptides fail the min-patients filter).
  # Contrast: T2+T3 vs T0.
  - name: PE5
    tissue: esophageal
    layer: phospho
    tissue: esophageal
    norm: raw
    file: pe5_phospho_full
    gene: Symbol
    feature_id: Feature
    site: Peptide
    logFC: Phospho_logFC
    pval: Phospho_P
    padj: "Phospho_adj.P"
    require_notna: Phospho_P
    fc_scale: log2
    universe: self
    calls: stats
    paired_with: PE5|prot_adj

  - name: PE5
    tissue: esophageal
    layer: phospho
    tissue: esophageal
    norm: prot_adj
    file: pe5_phospho_full
    gene: Symbol
    feature_id: Feature
    site: Peptide
    logFC: AdjA_logFC
    pval: AdjA_P
    padj: "AdjA_adj.P"
    require_notna: AdjA_P
    fc_scale: log2
    universe: self
    calls: stats
    paired_with: PE5|raw

  # ---------------------------------------------------------------- genome
  # Truncating loss-of-function small variants only: every row of the source's
  # "Total variant list" carries frameshift_variant or stop_gained. No
  # missense, no copy number, no structural variants, no non-coding -- so an
  # absent genomics signal means "not truncated", never "not altered".
  #
  # Sheet 2 ("Total variant list") is used, not sheet 1 ("LOF variant
  # filtering"): sheet 1 keeps only variants whose truncation ratio is <= 50%,
  # which excludes the EARLY, strongest truncations (a TP53 stop at codon 94,
  # destroying 76% of the protein, is in sheet 2 but not sheet 1). That looks
  # like an inverted comparison in the upstream filter, and one cohort
  # (EGAS00001002864) is not filtered at all, so the filter is not reproducible
  # across cohorts. The truncation threshold is applied here instead, as a
  # named scheme in analysis.yaml, where it is explicit and testable.
  #
  # Gene-level evidence per cohort: n_lof (truncating variants seen),
  # n_lof_strong (those destroying >= 50% of the protein), and MutSig2CV
  # p / q / rank. The universe is MutSig's own gene list (19,260 genes).
  # `reader: genomics` builds that gene-level table from the two sheets.
  # Direction is always "down": a truncation is loss of function.

  - name: TCGA_STAD
    layer: genome
    tissue: gastric
    norm: na
    reader: genomics
    file: gen_tcga_stad
    variant_sheet: "2"
    mutsig_sheet: "3"
    n_patients: 272
    ethnicity: Caucasian
    disease: "Gastric cancer"

  - name: SRP185502
    layer: genome
    tissue: gastric
    norm: na
    reader: genomics
    file: gen_srp
    variant_sheet: "2"
    mutsig_sheet: "3"
    n_patients: 25
    ethnicity: Asian
    disease: "Gastric cancer"

  - name: HRA000021
    layer: genome
    tissue: esophageal
    norm: na
    reader: genomics
    file: gen_hra
    variant_sheet: "2"
    mutsig_sheet: "3"
    n_patients: 508
    ethnicity: Asian
    disease: "Esophageal squamous cell carcinoma"

  - name: TCGA_ESCA
    layer: genome
    tissue: esophageal
    norm: na
    reader: genomics
    file: gen_tcga_esca
    variant_sheet: "2"
    mutsig_sheet: "3"
    n_patients: 114
    ethnicity: Caucasian
    disease: "Esophageal carcinoma"

  - name: EGAS00001002864
    layer: genome
    tissue: esophageal
    norm: na
    reader: genomics
    file: gen_egas
    variant_sheet: "2"
    mutsig_sheet: "3"
    n_patients: 89
    ethnicity: unknown
    disease: "Esophageal adenocarcinoma"

