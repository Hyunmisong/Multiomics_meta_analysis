# The analysis input: two harmonised, uncut tables built by
# `scripts/00_build_master.py` from the registry in `config/sources.yaml`.
#
# Everything below is a row-slice of one of those two files. Fold changes are
# already log2, FDR is already present, gene symbols are already resolved, so
# the entries carry no per-cohort quirks -- those live in sources.yaml and are
# resolved once, at build time.
#
# layer  : proteome | phospho | transcriptome | genome | scrna
# norm   : phospho only -- raw (as measured) or prot_adj (divided by the
#          parent protein). Other layers use "na".
# where  : the row filter selecting this cohort out of the master table.
# calls  : stats (from the statistics) | provided (source ships a direction
#          call only; the threshold schemes collapse to that call)

paths:
  proteome: "data/master/GEC_master_proteome.csv"
  phospho: "data/master/GEC_master_phospho.csv"
  genome: "data/master/GEC_master_genome.csv"
  scrna: "data/master/GEC_master_scrna.csv"

datasets:
  # ---------------------------------------------------------------- proteome
  - name: PG1
    layer: proteome
    tissue: gastric
    norm: na
    file: proteome
    where: {dataset: PG1}
    gene: gene
    feature_id: feature_id
    logFC: logFC
    pval: pval
    padj: padj
    fc_scale: log2
    universe: self
    calls: stats

  - name: PG2
    layer: proteome
    tissue: gastric
    norm: na
    file: proteome
    where: {dataset: PG2}
    gene: gene
    feature_id: feature_id
    logFC: logFC
    pval: pval
    padj: padj
    fc_scale: log2
    universe: self
    calls: stats

  - name: PG3
    layer: proteome
    tissue: gastric
    norm: na
    file: proteome
    where: {dataset: PG3}
    gene: gene
    feature_id: feature_id
    logFC: logFC
    pval: pval
    padj: padj
    fc_scale: log2
    universe: self
    calls: stats

  - name: PG4
    layer: proteome
    tissue: gastric
    norm: na
    file: proteome
    where: {dataset: PG4}
    gene: gene
    feature_id: feature_id
    logFC: logFC
