  - name: GE3
    layer: genome
    tissue: esophageal
    norm: na
    file: genome
    where: {dataset: GE3}
    gene: gene
    feature_id: gene
    logFC: null
    pval: mutsig_p
    padj: mutsig_q
    n_alt: n_alt
    n_alt_strong: n_alt_strong
    alt_rank: alt_rank
    universe: self
    calls: genome

  # ------------------------------------------------------------------ scrna
  # Pseudobulk DESeq2 tumour-vs-normal per cell lineage, built by
  # 03_integration/scrna/build_scrna_deg_table.py. One arm per study: the same
  # contrast is run inside each lineage, so counting lineages would let a study
  # win on annotation depth rather than biology. The lineage rows are kept as
  # features and collapse to one call per gene, which records which lineage
  # carried the signal without giving it a vote.
  #
  # SG6 is deliberately absent: its minimum padj is 0.168 across 180k
  # rows, so it contributes no FDR-level evidence under any scheme.

  - name: SG1
    layer: scrna
    tissue: gastric
    norm: na
    file: scrna
    where: {dataset: SG1}
    gene: gene
    feature_id: gene
    site: lineage
    logFC: logFC
    pval: pval
    padj: padj
    fc_scale: log2
    universe: self
    calls: stats

  - name: SE1
